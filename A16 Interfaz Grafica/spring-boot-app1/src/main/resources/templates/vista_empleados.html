<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Información de Empleado</title>
</head>
<body>
    <h1>Información de Empleado</h1>
    <ul>
        <li><strong>Nombre:</strong> <span th:text="${empleado.nombre}"></span></li>
        <li><strong>Apellido:</strong> <span th:text="${empleado.apellido}"></span></li>
        <li><strong>Dirección:</strong>
            <span th:text="${empleado.direccion != null ? empleado.direccion : 'No tiene dirección'}"></span>
        </li>
        <li><strong>Puesto:</strong> <span th:text="${empleado.puesto}"></span></li>
        <li><strong>Edad:</strong> <span th:text="${empleado.edad}"></span></li>
        <li><strong>Teléfono:</strong> <span th:text="${empleado.telefono}"></span></li>
        <li><strong>ID:</strong> <span th:text="${empleado.id}"></span></li>
    </ul>

    <h2>Lista de Empleados (@ModelAttribute)</h2>
    <table border="1">
        <thead>
            <tr>
                <th>ID</th><th>Nombre</th><th>Apellido</th><th>Dirección</th><th>Puesto</th><th>Edad</th><th>Teléfono</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="emp : ${empleados}">
                <td th:text="${emp.id}"></td>
                <td th:text="${emp.nombre}"></td>
                <td th:text="${emp.apellido}"></td>
                <td th:text="${emp.direccion}"></td>
                <td th:text="${emp.puesto}"></td>
                <td th:text="${emp.edad}"></td>
                <td th:text="${emp.telefono}"></td>
            </tr>
        </tbody>
    </table>
</body>
</html>
